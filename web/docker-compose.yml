# docker-compose SOLO para pruebas locales de los 10 retos web.
# En produccion se usa compose.prod.yml (instancias fijas detras de Caddy).
# Aqui cada uno expone un puerto fijo para probar en localhost.
services:
  login_injectado:
    build: ./login_injectado
    ports: ["5001:5000"]
  robots_traviesos:
    build: ./robots_traviesos
    ports: ["5002:5000"]
  cambia_el_id:
    build: ./cambia_el_id
    ports: ["5003:5000"]
  galleta_falsa:
    build: ./galleta_falsa
    ports: ["5004:5000"]
  token_quebrado:
    build: ./token_quebrado
    ports: ["5005:5000"]
  incluyeme:
    build: ./incluyeme
    ports: ["5006:5000"]
  cazador_agentes:
    build: ./cazador_agentes
    ports: ["5007:5000"]
  metodos_http:
    build: ./metodos_http
    ports: ["5008:5000"]
  ssrf_interno:
    build: ./ssrf_interno
    ports: ["5009:5000"]
  xxe_clasico:
    build: ./xxe_clasico
    ports: ["5010:5000"]
